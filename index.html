<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Portfolio Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Top HUD Header -->
  <header class="hud-header">
    <div class="brand">ALEX.DEV</div>
    <div class="hint">Click any node or move cursor to explore • Press ESC to close</div>
  </header>

  <!-- Interactive 2D Spatial Stage -->
  <main id="stage" class="stage">
    <div id="world" class="world">
      <!-- Connecting SVG Lines between nodes -->
      <svg class="connections" viewBox="0 0 1200 800" preserveAspectRatio="none">
        <line x1="600" y1="400" x2="320" y2="240" />
        <line x1="600" y1="400" x2="880" y2="230" />
        <line x1="600" y1="400" x2="340" y2="570" />
        <line x1="600" y1="400" x2="860" y2="560" />
      </svg>

      <!-- Center Hub Node -->
      <img
        class="fit-picture"
        src="/assets/command.png"
        alt="Paper" />
      
      <!-- <button class="node node--hub" data-id="about" style="left: 50%; top: 50%;">
        <span class="node__icon">✦</span>
        <span class="node__label">About Me</span>
      </button> -->

      <!-- Satellite Interactive Nodes -->
      <button class="node" data-id="project-1" style="left: 26.6%; top: 30%;">
        <span class="node__tag">01</span>
        <span class="node__label">3D Web Engine</span>
      </button>

      <button class="node" data-id="project-2" style="left: 73.3%; top: 28.7%;">
        <span class="node__tag">02</span>
        <span class="node__label">AI Sound Lab</span>
      </button>

      <button class="node" data-id="skills" style="left: 28.3%; top: 71.2%;">
        <span class="node__tag">03</span>
        <span class="node__label">Tech Stack</span>
      </button>

      <button class="node" data-id="contact" style="left: 71.6%; top: 70%;">
        <span class="node__tag">04</span>
        <span class="node__label">Contact</span>
      </button>
    </div>
  </main>

  <!-- Slide-over Detail Drawer -->
  <aside id="drawer" class="drawer" aria-hidden="true">
    <button id="close-drawer" class="drawer__close" aria-label="Close details">&times;</button>
    <div class="drawer__content">
      <span id="drawer-category" class="drawer__category">Category</span>
      <h1 id="drawer-title" class="drawer__title">Title</h1>
      <p id="drawer-summary" class="drawer__summary">Summary goes here.</p>
      <div id="drawer-tags" class="drawer__tags"></div>
      <div id="drawer-details" class="drawer__details"></div>
      <a id="drawer-link" class="drawer__link" href="#" target="_blank" rel="noopener noreferrer">
        Open Project &rarr;
      </a>
    </div>
  </aside>

  <!-- Backdrop -->
  <div id="backdrop" class="backdrop"></div>

  <!-- Load data first, then logic (works offline via file:// and on GitHub Pages) -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
