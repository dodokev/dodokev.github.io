<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Portfolio Demo</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0" rel="stylesheet">
</head>
<body>
  <!-- Top HUD Header -->
  <header class="hud-header">
    <!-- <div class="brand">ALEX.DEV</div> -->
    <div class="hint">Click any pinned paper to view their informations • Press ESC to close</div>
  </header>

  <!-- Interactive 2D Spatial Stage -->
  <main id="stage" class="stage">
    <div id="world" class="world">
      <!-- Connecting SVG Lines between nodes -->
      <svg id="connections" class="connections">
        <path data-from="about" data-to="project-1" />
        <path data-from="about" data-to="project-2" />
        <path data-from="about" data-to="skills" />
        <path data-from="about" data-to="contact" />

        <image class="thread-pin" data-node="about" href="assets/img/pin.png" width="24" height="24" />
        <image class="thread-pin" data-node="project-1" href="assets/img/pin.png" width="24" height="24" />
        <image class="thread-pin" data-node="project-2" href="assets/img/pin.png" width="24" height="24" />
        <image class="thread-pin" data-node="skills" href="assets/img/pin.png" width="24" height="24" />
        <image class="thread-pin" data-node="contact" href="assets/img/pin.png" width="24" height="24" />
      </svg>

      <!-- Center Hub Node -->      
      <button class="node node--image" data-id="about" style="left: 50%; top: 50%;">
        <img src="assets/img/about_me.png" alt="About Me" />
        <!-- <span class="node__label">About Me</span> -->
      </button>

      <!-- Satellite Interactive Nodes -->
      <button class="node node--image" data-id="project-1" style="left: 26.6%; top: 30%;">
        <img src="assets/img/about_me.png" alt="About Me" />
      </button>

      <button class="node node--image" data-id="project-2" style="left: 73.3%; top: 28.7%;">
        <img src="assets/img/about_me.png" alt="About Me" />
      </button>

      <button class="node node--image" id="skills" data-id="skills" style="left: 28.3%; top: 71.2%;">
        <img src="assets/img/about_me.png" alt="About Me" />
      </button>

      <button class="node node--image" data-id="contact" style="left: 71.6%; top: 70%;">
        <img src="assets/img/about_me.png" alt="About Me" />
      </button>
    </div>
  </main>

  <!-- Slide-over Detail Drawer -->
  <aside id="drawer" class="drawer" aria-hidden="true">
    <button id="close-drawer" class="drawer__close" aria-label="Close details">&times;</button>
    <div class="drawer__content">
      <span id="drawer-category" class="drawer__category">Category</span>
      <h1 id="drawer-title" class="drawer__title">Title</h1>
      <p id="drawer-summary" class="drawer__summary">Summary goes here.</p>
      <div id="drawer-tags" class="drawer__tags"></div>
      <div id="drawer-details" class="drawer__details"></div>
      <a id="drawer-link" class="drawer__link" href="#" target="_blank" rel="noopener noreferrer">
        Open Project &rarr;
      </a>
    </div>
  </aside>

  <!-- Backdrop -->
  <div id="backdrop" class="backdrop"></div>

  <!-- Load data first, then logic (works offline via file:// and on GitHub Pages) -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
